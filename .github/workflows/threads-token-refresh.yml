name: Threads token refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # 매주 월요일 03:00 UTC (장기 토큰은 약 60일 유효, 매주 갱신해 만료 방지)
permissions:
  contents: read
concurrency:
  group: threads-token-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh token and store it as a repository secret
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
        run: |
          # GITHUB_TOKEN 은 저장소 Secret 을 쓸 수 없어서, Secrets 쓰기 권한만 있는 PAT 가 필요하다.
          if [ -z "$SECRETS_PAT" ]; then
            echo "::error::SECRETS_PAT secret is required to store the refreshed token"
            exit 1
          fi
          export TOKEN_OUT="$RUNNER_TEMP/new_token"
          node automation/refresh-token.mjs
          GH_TOKEN="$SECRETS_PAT" gh secret set THREADS_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$TOKEN_OUT"
          rm -f "$TOKEN_OUT"
          echo "Token refreshed and stored."
