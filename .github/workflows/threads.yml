name: Threads scheduled publishing
on:
  workflow_dispatch:
  schedule:
    - cron: '0,10,20 8 * * 1-5'
permissions:
  contents: write
concurrency:
  group: threads-publishing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test automation/publish.test.mjs
      - name: Publish verified queue
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: node automation/publish.mjs --live
      - name: Persist result even after failure
        if: always()
        run: |
          git config user.name "Coupicks publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add automation/queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Threads publishing state"
            # 수동 push 와 겹쳐도 상태가 사라지지 않게 rebase 후 재시도.
            # 그래도 실패하면 다음 실행의 원격 대조(reconcile)가 중복 게시를 막는다.
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep $((i * 5))
            done
            echo "::warning::state push failed; next run will reconcile against Threads"
            exit 1
          fi
