<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO 기본 태그: 검색 노출에 도움됨. products.js 의 SITE_CONFIG 값으로 자동 반영됩니다 -->
    <title>오늘의 추천템 | 가성비 아이템 모음</title>
    <meta
      name="description"
      content="직접 고른 가성비 좋은 상품들을 한눈에 모아봤습니다."
    />
    <!--BUILD:HEAD-->
    <link rel="canonical" href="https://eugenek99.github.io/Coupicks/" />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="오늘의 추천템" />
    <meta property="og:description" content="가성비 기준으로 골라 모은 아이템 모음" />
    <meta property="og:url" content="https://eugenek99.github.io/Coupicks/" />
    <meta property="og:image" content="https://placehold.co/400x400?text=Product+1" />
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"ItemList","name":"오늘의 추천템","itemListElement":[{"@type":"ListItem","position":1,"url":"https://eugenek99.github.io/Coupicks/p/cordless-vacuum/","name":"예시 무선 청소기 (샘플)"},{"@type":"ListItem","position":2,"url":"https://eugenek99.github.io/Coupicks/p/bluetooth-earbuds/","name":"예시 블루투스 이어폰 (샘플)"},{"@type":"ListItem","position":3,"url":"https://eugenek99.github.io/Coupicks/p/tumbler-500ml/","name":"예시 텀블러 500ml (샘플)"},{"@type":"ListItem","position":4,"url":"https://eugenek99.github.io/Coupicks/p/mechanical-keyboard/","name":"예시 기계식 키보드 (샘플)"}]}</script>
    <!--/BUILD:HEAD-->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 대가성 고지 (자동 삽입) -->
    <div class="disclosure" id="disclosure"></div>

    <header>
      <button
        class="theme-toggle"
        id="theme-toggle"
        aria-label="다크모드 전환"
        title="다크모드 전환"
      >
        🌙
      </button>
      <h1 id="site-name"></h1>
      <p id="tagline"></p>
    </header>

    <!-- 검색 + 정렬 -->
    <div class="controls">
      <label class="search">
        <span aria-hidden="true">🔍</span>
        <input
          type="text"
          id="search"
          placeholder="상품 이름으로 검색..."
          autocomplete="off"
        />
      </label>
      <select id="sort" aria-label="정렬">
        <option value="default">추천순</option>
        <option value="price-asc">가격 낮은순</option>
        <option value="price-desc">가격 높은순</option>
        <option value="rating">별점 높은순</option>
      </select>
    </div>

    <!-- 카테고리 필터 탭 (상품에 category 가 있으면 자동 생성) -->
    <div class="filters" id="filters"></div>

    <div class="result-count" id="result-count"></div>

    <!-- 상품 카드가 자동으로 채워지는 영역 -->
    <main class="grid" id="grid"></main>

    <footer>
      <!--BUILD:LINKS-->
    <nav class="seo-list" aria-label="상품 상세"><a href="p/cordless-vacuum/">예시 무선 청소기 (샘플)</a><a href="p/bluetooth-earbuds/">예시 블루투스 이어폰 (샘플)</a><a href="p/tumbler-500ml/">예시 텀블러 500ml (샘플)</a><a href="p/mechanical-keyboard/">예시 기계식 키보드 (샘플)</a></nav>
    <!--/BUILD:LINKS-->
      <p id="footer-note"></p>
    </footer>

    <!-- 데이터 파일 먼저 로드 -->
    <script src="products.js"></script>

    <!-- 렌더링 로직: 이 부분은 수정할 필요 없습니다 -->
    <script>
      (function () {
        // ── 설정값 채우기 ──
        document.title = SITE_CONFIG.siteName + " | " + SITE_CONFIG.tagline;
        document.getElementById("site-name").textContent =
          SITE_CONFIG.siteName;
        document.getElementById("tagline").textContent = SITE_CONFIG.tagline;
        document.getElementById("disclosure").textContent =
          SITE_CONFIG.disclosure;
        document.getElementById("footer-note").textContent =
          SITE_CONFIG.disclosure;

        var grid = document.getElementById("grid");
        var filtersEl = document.getElementById("filters");
        var searchEl = document.getElementById("search");
        var sortEl = document.getElementById("sort");
        var countEl = document.getElementById("result-count");

        var allProducts = Array.isArray(PRODUCTS) ? PRODUCTS.slice() : [];
        var activeCategory = "전체";

        // ── 다크모드: 저장된 설정 복원 ──
        var toggle = document.getElementById("theme-toggle");
        var savedTheme = null;
        try {
          savedTheme = localStorage.getItem("theme");
        } catch (e) {}
        function applyTheme(t) {
          document.documentElement.setAttribute("data-theme", t);
          toggle.textContent = t === "dark" ? "☀️" : "🌙";
        }
        applyTheme(savedTheme === "dark" ? "dark" : "light");
        toggle.addEventListener("click", function () {
          var next =
            document.documentElement.getAttribute("data-theme") === "dark"
              ? "light"
              : "dark";
          applyTheme(next);
          try {
            localStorage.setItem("theme", next);
          } catch (e) {}
        });

        // 상품이 없을 때
        if (allProducts.length === 0) {
          grid.innerHTML =
            '<div class="empty">아직 등록된 상품이 없습니다.<br>products.js 파일에 상품을 추가해 주세요.</div>';
          return;
        }

        // ── 유틸 ──
        function esc(s) {
          if (s == null) return "";
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }
        // 별점 → 별 문자열 (반올림)
        function stars(r) {
          var n = Math.round(Number(r) || 0);
          if (n < 0) n = 0;
          if (n > 5) n = 5;
          return "★★★★★".slice(0, n) + "☆☆☆☆☆".slice(0, 5 - n);
        }
        // 정렬용 가격: sortPrice 우선, 없으면 price 에서 숫자 추출
        function priceOf(p) {
          if (typeof p.sortPrice === "number") return p.sortPrice;
          if (p.price) {
            var num = String(p.price).replace(/[^0-9]/g, "");
            if (num) return parseInt(num, 10);
          }
          return null;
        }

        // ── 블로그 등 외부 글에서 딥링크: ?cat=주방 &q=키보드 &sort=rating ──
        var params = new URLSearchParams(location.search);
        if (params.get("q")) searchEl.value = params.get("q");
        if (params.get("sort")) sortEl.value = params.get("sort");
        var wantCat = params.get("cat");

        // ── 카테고리 탭 생성 ──
        var cats = [];
        allProducts.forEach(function (p) {
          if (p.category && cats.indexOf(p.category) === -1)
            cats.push(p.category);
        });
        if (cats.length > 0) {
          var tabs = ["전체"].concat(cats);
          tabs.forEach(function (c) {
            var b = document.createElement("button");
            b.className = "chip" + (c === "전체" ? " active" : "");
            b.textContent = c;
            b.addEventListener("click", function () {
              activeCategory = c;
              filtersEl
                .querySelectorAll(".chip")
                .forEach(function (x) {
                  x.classList.remove("active");
                });
              b.classList.add("active");
              render();
            });
            filtersEl.appendChild(b);
          });
        }

        // 딥링크로 지정한 카테고리가 실제 존재하면 적용
        if (wantCat && cats.indexOf(wantCat) !== -1) {
          activeCategory = wantCat;
          filtersEl.querySelectorAll(".chip").forEach(function (x) {
            x.classList.toggle("active", x.textContent === wantCat);
          });
        }

        // ── 카드 하나 생성 ──
        function cardHTML(p) {
          var img = p.image
            ? '<img src="' +
              esc(p.image) +
              '" alt="' +
              esc(p.title) +
              '" loading="lazy" />'
            : "";
          var badge = p.badge
            ? '<span class="badge">' + esc(p.badge) + "</span>"
            : "";
          var catTag = p.category
            ? '<span class="cat-tag">' + esc(p.category) + "</span>"
            : "";
          var desc = p.desc
            ? '<div class="desc">' + esc(p.desc) + "</div>"
            : "";
          var rating =
            p.rating != null
              ? '<div class="rating"><span class="stars">' +
                stars(p.rating) +
                "</span><span>" +
                Number(p.rating).toFixed(1) +
                (p.reviews != null
                  ? " (" + Number(p.reviews).toLocaleString() + ")"
                  : "") +
                "</span></div>"
              : "";
          var price = p.price && SITE_CONFIG.showPrice
            ? '<div class="price">' + esc(p.price) + "</div>"
            : "";

          return (
            '<div class="thumb">' +
            badge +
            catTag +
            img +
            "</div>" +
            '<div class="body">' +
            '<div class="name">' +
            esc(p.title) +
            "</div>" +
            desc +
            rating +
            price +
            "</div>" +
            '<div class="cta">쿠팡에서 최저가 확인 →</div>'
          );
        }

        // ── 필터 + 정렬 + 렌더 ──
        function render() {
          var q = (searchEl.value || "").trim().toLowerCase();
          var list = allProducts.filter(function (p) {
            if (!p || !p.link) return false;
            if (activeCategory !== "전체" && p.category !== activeCategory)
              return false;
            if (q && String(p.title || "").toLowerCase().indexOf(q) === -1)
              return false;
            return true;
          });

          var mode = sortEl.value;
          if (mode === "price-asc" || mode === "price-desc") {
            list.sort(function (a, b) {
              var pa = priceOf(a),
                pb = priceOf(b);
              if (pa == null) return 1;
              if (pb == null) return -1;
              return mode === "price-asc" ? pa - pb : pb - pa;
            });
          } else if (mode === "rating") {
            list.sort(function (a, b) {
              return (Number(b.rating) || 0) - (Number(a.rating) || 0);
            });
          }

          countEl.textContent = "총 " + list.length + "개 상품";

          if (list.length === 0) {
            grid.innerHTML =
              '<div class="empty">조건에 맞는 상품이 없어요.</div>';
            return;
          }

          grid.innerHTML = "";
          list.forEach(function (p, i) {
            var a = document.createElement("a");
            a.className = "card";
            a.href = p.link;
            a.target = "_blank";
            a.rel = "nofollow sponsored noopener";
            a.style.animationDelay = i * 0.05 + "s"; // 순차 페이드인
            a.innerHTML = cardHTML(p);
            grid.appendChild(a);
          });
        }

        // ── 이벤트 ──
        searchEl.addEventListener("input", render);
        sortEl.addEventListener("change", render);

        render();
      })();
    </script>
  </body>
</html>
