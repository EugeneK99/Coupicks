<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO 기본 태그: 검색 노출에 도움됨. products.js 의 SITE_CONFIG 값으로 자동 반영됩니다 -->
    <title>오늘의 추천템 | 가성비 아이템 모음</title>
    <meta
      name="description"
      content="직접 고른 가성비 좋은 상품들을 한눈에 모아봤습니다."
    />
    <!--BUILD:HEAD-->
    <link rel="canonical" href="https://eugenek99.github.io/Coupicks/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="오늘의 추천템" />
    <meta property="og:description" content="가성비 기준으로 골라 모은 아이템 모음" />
    <meta property="og:url" content="https://eugenek99.github.io/Coupicks/" />
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"ItemList","name":"오늘의 추천템","itemListElement":[{"@type":"ListItem","position":1,"url":"https://eugenek99.github.io/Coupicks/p/bluetooth-speaker/","name":"브리츠 BZ-TX11 블루투스 스피커 (화이트)"},{"@type":"ListItem","position":2,"url":"https://eugenek99.github.io/Coupicks/p/daily-headphone/","name":"소니 WH-CH520 블루투스 헤드폰 (화이트)"},{"@type":"ListItem","position":3,"url":"https://eugenek99.github.io/Coupicks/p/nc-earphone/","name":"QCY HT19 MeloB 노이즈캔슬링 블루투스 이어폰 (블랙)"},{"@type":"ListItem","position":4,"url":"https://eugenek99.github.io/Coupicks/p/moistrue-tuna/","name":"동원 뉴트리플랜 모이스트루 참치 (고양이 습식 파우치 80g)"},{"@type":"ListItem","position":5,"url":"https://eugenek99.github.io/Coupicks/p/moistrue-tuna-chicken/","name":"동원 뉴트리플랜 모이스트루 참치&닭고기 (고양이 습식 파우치 80g)"},{"@type":"ListItem","position":6,"url":"https://eugenek99.github.io/Coupicks/p/locknlock-baro-hankki/","name":"락앤락 바로한끼 밥용기 세트 라이트 (2세트 320ml 3P)"}]}</script>
    <!--/BUILD:HEAD-->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 대가성 고지 (자동 삽입) -->
    <div class="disclosure" id="disclosure"></div>

    <header>
      <button
        class="theme-toggle"
        id="theme-toggle"
        aria-label="다크모드 전환"
        title="다크모드 전환"
      >
        🌙
      </button>
      <h1 id="site-name"></h1>
      <p id="tagline"></p>
    </header>

    <!-- 검색 + 정렬 -->
    <div class="controls">
      <label class="search">
        <span aria-hidden="true">🔍</span>
        <input
          type="text"
          id="search"
          placeholder="상품 이름으로 검색..."
          autocomplete="off"
        />
      </label>
      <select id="sort" aria-label="정렬">
        <option value="default">추천순</option>
        <option value="price-asc">가격 낮은순</option>
        <option value="price-desc">가격 높은순</option>
        <option value="rating">별점 높은순</option>
      </select>
    </div>

    <!-- 블로그 유입 안내 배너 (딥링크로 들어오면 자동 표시) -->
    <div class="context-bar" id="context-bar" style="display: none"></div>

    <!-- 관련 가이드 유도 배너 (자동 생성) -->
    <div class="guide-banner" id="guide-banner"></div>

    <!-- 카테고리 필터 탭 (상품에 category 가 있으면 자동 생성) -->
    <div class="filters" id="filters"></div>

    <div class="result-count" id="result-count"></div>

    <!-- 상품 카드가 자동으로 채워지는 영역 -->
    <main class="grid" id="grid"></main>

    <footer>
      <!--BUILD:LINKS-->
    <nav class="seo-list" aria-label="상품 상세"><a href="g/music-audio-picks/">노래 들을 때 쓰는 오디오 3종 (스피커·헤드폰·이어폰)</a><a href="p/bluetooth-speaker/">브리츠 BZ-TX11 블루투스 스피커 (화이트)</a><a href="p/daily-headphone/">소니 WH-CH520 블루투스 헤드폰 (화이트)</a><a href="p/nc-earphone/">QCY HT19 MeloB 노이즈캔슬링 블루투스 이어폰 (블랙)</a><a href="p/moistrue-tuna/">동원 뉴트리플랜 모이스트루 참치 (고양이 습식 파우치 80g)</a><a href="p/moistrue-tuna-chicken/">동원 뉴트리플랜 모이스트루 참치&amp;닭고기 (고양이 습식 파우치 80g)</a><a href="p/locknlock-baro-hankki/">락앤락 바로한끼 밥용기 세트 라이트 (2세트 320ml 3P)</a></nav>
    <!--/BUILD:LINKS-->
      <p id="footer-note"></p>
    </footer>

    <!-- 데이터 파일 먼저 로드 -->
    <script src="products.js"></script>
    <!-- 가이드 데이터 (없거나 로드 실패해도 사이트는 정상 동작) -->
    <script src="guides.js" onerror="window.GUIDES=window.GUIDES||[]"></script>

    <!-- 렌더링 로직: 이 부분은 수정할 필요 없습니다 -->
    <script>
      (function () {
        // ── 설정값 채우기 ──
        document.title = SITE_CONFIG.siteName + " | " + SITE_CONFIG.tagline;
        document.getElementById("site-name").textContent =
          SITE_CONFIG.siteName;
        document.getElementById("tagline").textContent = SITE_CONFIG.tagline;
        document.getElementById("disclosure").textContent =
          SITE_CONFIG.disclosure;
        document.getElementById("footer-note").textContent =
          SITE_CONFIG.disclosure;

        var grid = document.getElementById("grid");
        var filtersEl = document.getElementById("filters");
        var searchEl = document.getElementById("search");
        var sortEl = document.getElementById("sort");
        var countEl = document.getElementById("result-count");

        var allProducts = Array.isArray(PRODUCTS) ? PRODUCTS.slice() : [];
        var activeCategory = "전체";

        // ── 다크모드: 저장된 설정 복원 ──
        var toggle = document.getElementById("theme-toggle");
        var savedTheme = null;
        try {
          savedTheme = localStorage.getItem("theme");
        } catch (e) {}
        function applyTheme(t) {
          document.documentElement.setAttribute("data-theme", t);
          toggle.textContent = t === "dark" ? "☀️" : "🌙";
        }
        applyTheme(savedTheme === "dark" ? "dark" : "light");
        toggle.addEventListener("click", function () {
          var next =
            document.documentElement.getAttribute("data-theme") === "dark"
              ? "light"
              : "dark";
          applyTheme(next);
          try {
            localStorage.setItem("theme", next);
          } catch (e) {}
        });

        // 상품이 없을 때
        if (allProducts.length === 0) {
          grid.innerHTML =
            '<div class="empty">아직 등록된 상품이 없습니다.<br>products.js 파일에 상품을 추가해 주세요.</div>';
          return;
        }

        // ── 유틸 ──
        function esc(s) {
          if (s == null) return "";
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }
        // 별점 → 별 문자열 (반올림)
        function stars(r) {
          var n = Math.round(Number(r) || 0);
          if (n < 0) n = 0;
          if (n > 5) n = 5;
          return "★★★★★".slice(0, n) + "☆☆☆☆☆".slice(0, 5 - n);
        }
        // 정렬용 가격: sortPrice 우선, 없으면 price 에서 숫자 추출
        function priceOf(p) {
          if (typeof p.sortPrice === "number") return p.sortPrice;
          if (p.price) {
            var num = String(p.price).replace(/[^0-9]/g, "");
            if (num) return parseInt(num, 10);
          }
          return null;
        }

        // ── 블로그 등 외부 글에서 딥링크: ?cat=주방 &q=키보드 &sort=rating ──
        var params = new URLSearchParams(location.search);
        if (params.get("q")) searchEl.value = params.get("q");
        if (params.get("sort")) sortEl.value = params.get("sort");
        var wantCat = params.get("cat");

        // 유입 추적용 utm 파라미터는 상세 페이지 이동 시 그대로 넘겨준다
        // (쿠팡 링크에는 붙이지 않음: 링크 변형은 파트너스 정책상 위험)
        var utmKeep = [];
        ["utm_source", "utm_medium", "utm_campaign"].forEach(function (k) {
          if (params.get(k)) utmKeep.push(k + "=" + encodeURIComponent(params.get(k)));
        });
        var detailQuery = utmKeep.length ? "?" + utmKeep.join("&") : "";

        // ── 카테고리 탭 생성 ──
        var cats = [];
        allProducts.forEach(function (p) {
          if (p.category && cats.indexOf(p.category) === -1)
            cats.push(p.category);
        });
        if (cats.length > 0) {
          var tabs = ["전체"].concat(cats);
          tabs.forEach(function (c) {
            var b = document.createElement("button");
            b.className = "chip" + (c === "전체" ? " active" : "");
            b.textContent = c;
            b.addEventListener("click", function () {
              activeCategory = c;
              filtersEl
                .querySelectorAll(".chip")
                .forEach(function (x) {
                  x.classList.remove("active");
                });
              b.classList.add("active");
              render();
            });
            filtersEl.appendChild(b);
          });
        }

        // 딥링크로 지정한 카테고리가 실제 존재하면 적용
        if (wantCat && cats.indexOf(wantCat) !== -1) {
          activeCategory = wantCat;
          filtersEl.querySelectorAll(".chip").forEach(function (x) {
            x.classList.toggle("active", x.textContent === wantCat);
          });
        }

        // ── ③ 블로그 유입 안내 배너 ──
        // 티스토리 등에서 딥링크(?cat= / ?q= / utm_source=tistory)로 넘어온 경우,
        // "지금 무엇을 보고 있는지" 알려주고 전체 보기로 되돌아갈 길을 준다.
        (function showContextBar() {
          var bar = document.getElementById("context-bar");
          var fromBlog = params.get("utm_source") || wantCat || params.get("q");
          if (!fromBlog) return;
          var msg = "";
          if (activeCategory !== "전체") {
            msg = "🎯 '" + activeCategory + "' 관련 추천템만 보고 있어요";
          } else if (params.get("q")) {
            msg = "🔍 '" + params.get("q") + "' 검색 결과를 보고 있어요";
          } else {
            msg = "👋 블로그에서 오셨네요! 추천템을 모아뒀어요";
          }
          bar.innerHTML =
            '<span class="ctx-msg">' +
            esc(msg) +
            '</span><a class="ctx-reset" href="./">전체 보기 →</a>';
          bar.style.display = "flex";
        })();

        // ── ③ 관련 가이드 유도 배너 ──
        // guides.js 의 GUIDES 중, 현재 카테고리 상품을 포함하는 가이드를 상단에 노출.
        (function showGuideBanner() {
          var wrap = document.getElementById("guide-banner");
          // guides.js 는 전역 const GUIDES 로 선언됨. src 로 로드 시 window 에
          // 자동으로 안 붙을 수 있어 typeof 로 안전하게 참조한다.
          var guides = typeof GUIDES !== "undefined" && Array.isArray(GUIDES)
            ? GUIDES
            : [];
          if (!guides.length) return;

          // 현재 활성 카테고리에 속한 상품 slug 집합
          var activeSlugs = {};
          allProducts.forEach(function (p) {
            if (activeCategory === "전체" || p.category === activeCategory) {
              if (p.slug) activeSlugs[p.slug] = true;
            }
          });

          var shown = guides.filter(function (g) {
            if (!g || !g.slug || !g.picks) return false;
            return g.picks.some(function (k) {
              return activeSlugs[k.slug];
            });
          });
          // 전체 보기일 땐 최대 2개만
          if (activeCategory === "전체") shown = shown.slice(0, 2);

          wrap.innerHTML = shown
            .map(function (g) {
              return (
                '<a href="g/' +
                esc(g.slug) +
                "/" +
                detailQuery +
                '"><span class="g-emoji">📖</span><span>' +
                esc(g.title) +
                '</span><span class="g-arrow">→</span></a>'
              );
            })
            .join("");
        })();

        // ── 카드 하나 생성 ──
        function cardHTML(p) {
          var img = p.image
            ? '<img src="' +
              esc(p.image) +
              '" alt="' +
              esc(p.title) +
              '" loading="lazy" />'
            : "";
          var badge = p.badge
            ? '<span class="badge">' + esc(p.badge) + "</span>"
            : "";
          var catTag = p.category
            ? '<span class="cat-tag">' + esc(p.category) + "</span>"
            : "";
          var desc = p.desc
            ? '<div class="desc">' + esc(p.desc) + "</div>"
            : "";
          var rating =
            p.rating != null
              ? '<div class="rating"><span class="stars">' +
                stars(p.rating) +
                "</span><span>" +
                Number(p.rating).toFixed(1) +
                (p.reviews != null
                  ? " (" + Number(p.reviews).toLocaleString() + ")"
                  : "") +
                "</span></div>"
              : "";
          var price = p.price && SITE_CONFIG.showPrice
            ? '<div class="price">' + esc(p.price) + "</div>"
            : "";

          // 상세 페이지(p/slug/)가 있으면 "상세·후기" 링크 노출
          var detail =
            p.slug && (p.review || p.rating != null)
              ? '<a class="detail-link" href="p/' +
                esc(p.slug) +
                "/" +
                detailQuery +
                '">ⓘ 후기</a>'
              : "";

          return (
            '<div class="thumb">' +
            badge +
            catTag +
            img +
            "</div>" +
            '<div class="body">' +
            '<div class="name">' +
            esc(p.title) +
            "</div>" +
            desc +
            rating +
            price +
            "</div>" +
            '<div class="actions">' +
            '<a class="cta stretched" href="' +
            esc(p.link) +
            '" target="_blank" rel="nofollow sponsored noopener" aria-label="' +
            esc(p.title) +
            ' 쿠팡에서 최저가 확인">쿠팡에서 최저가 확인 →</a>' +
            detail +
            "</div>"
          );
        }

        // ── 필터 + 정렬 + 렌더 ──
        function render() {
          var q = (searchEl.value || "").trim().toLowerCase();
          var list = allProducts.filter(function (p) {
            if (!p || !p.link) return false;
            if (activeCategory !== "전체" && p.category !== activeCategory)
              return false;
            if (q && String(p.title || "").toLowerCase().indexOf(q) === -1)
              return false;
            return true;
          });

          var mode = sortEl.value;
          if (mode === "price-asc" || mode === "price-desc") {
            list.sort(function (a, b) {
              var pa = priceOf(a),
                pb = priceOf(b);
              if (pa == null) return 1;
              if (pb == null) return -1;
              return mode === "price-asc" ? pa - pb : pb - pa;
            });
          } else if (mode === "rating") {
            list.sort(function (a, b) {
              return (Number(b.rating) || 0) - (Number(a.rating) || 0);
            });
          }

          countEl.textContent = "총 " + list.length + "개 상품";

          if (list.length === 0) {
            grid.innerHTML =
              '<div class="empty">조건에 맞는 상품이 없어요.</div>';
            return;
          }

          grid.innerHTML = "";
          list.forEach(function (p, i) {
            // 카드는 div: 쿠팡 <a> 가 카드 전체를 덮고(stretched link),
            // "ⓘ 후기" 링크는 그 위에 따로 떠 있어 중첩 <a> 없이 둘 다 진짜 링크로 동작
            var card = document.createElement("div");
            card.className = "card";
            card.style.animationDelay = i * 0.05 + "s"; // 순차 페이드인
            card.innerHTML = cardHTML(p);
            grid.appendChild(card);
          });
        }

        // ── 이벤트 ──
        searchEl.addEventListener("input", render);
        sortEl.addEventListener("change", render);

        render();
      })();
    </script>
  </body>
</html>
